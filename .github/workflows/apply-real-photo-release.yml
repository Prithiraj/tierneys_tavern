name: Apply real-photo website release

on:
  push:
    branches: [main]
    paths:
      - .release/**
      - .github/workflows/apply-real-photo-release.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  pages: write
  id-token: write

concurrency:
  group: apply-real-photo-release
  cancel-in-progress: false

jobs:
  apply:
    name: Decode, validate and commit release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install image dependency
        run: python -m pip install --disable-pip-version-check --quiet "Pillow==12.3.0"

      - name: Reconstruct release archive
        shell: bash
        run: |
          set -euo pipefail
          cat .release/chunk00 .release/chunk01 .release/chunk02 .release/chunk03 .release/chunk04 \
            | base64 --decode > /tmp/tierneys-real-photo-release.tar.gz
          echo "c0dd5498844f6ddf7a33c0d0bf1145bd9f53171effc8fc472db1bcad66ec785b  /tmp/tierneys-real-photo-release.tar.gz" \
            | sha256sum --check
          tar -xzf /tmp/tierneys-real-photo-release.tar.gz -C .
          chmod +x scripts/build_site.sh scripts/generate_public_assets.py

      - name: Validate real-photo public build
        shell: bash
        run: |
          set -euo pipefail
          PUBLIC_SITE_URL="https://prithiraj.github.io/tierneys_tavern" \
            COMMIT_SHA="$GITHUB_SHA" \
            bash scripts/build_site.sh
          test -s dist/index.html
          test -s dist/assets/images/exterior-hero.webp
          test -s dist/assets/images/buddy-burger.webp
          test -s dist/assets/images/upstairs.webp
          test -s dist/assets/images/family.webp
          test -s dist/assets/public/tierneys-social-card.jpg
          ! grep -R -i -E '<svg class="burger"|research before render|real asset board' dist
          grep -F "Prices shown are an archival snapshot" dist/index.html

      - name: Commit finished implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .release dist .public-build-venv
          rm -f .github/workflows/apply-real-photo-release.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: replace illustrations with real Tierney's photography"
          git push origin HEAD:main

      - name: Dispatch GitHub Pages workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/pages.yml/dispatches" \
            --data '{"ref":"main"}'

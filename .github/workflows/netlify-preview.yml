name: Publish claimable Netlify preview

on:
  push:
    branches: [main]
    paths:
      - index.html
      - netlify.toml
      - WEBSITE_DESIGN_PLAN.md
      - ASSET_MANIFEST.md
      - assets/**
      - location/**
      - scripts/build_netlify.sh
      - .github/workflows/netlify-preview.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: netlify-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build deterministic preview bundle
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: bash scripts/build_netlify.sh

      - name: Publish anonymous production preview
        id: netlify
        shell: bash
        run: |
          set -o pipefail
          npx --yes netlify-cli@latest deploy \
            --prod \
            --dir=dist \
            --allow-anonymous \
            --json | tee netlify-deploy.json

          node <<'NODE'
          const fs = require('fs');
          const text = fs.readFileSync('netlify-deploy.json', 'utf8').trim();
          let data = {};
          try {
            const first = text.indexOf('{');
            const last = text.lastIndexOf('}');
            if (first >= 0 && last > first) data = JSON.parse(text.slice(first, last + 1));
          } catch (error) {
            console.warn(`Could not parse Netlify JSON directly: ${error.message}`);
          }

          const url = data.ssl_url || data.url || data.deploy_url || data.site_url ||
            (text.match(/https:\/\/[a-z0-9-]+\.netlify\.app\/?/i) || [])[0];
          const claim = data.claim_url || data.claimUrl ||
            (text.match(/https:\/\/app\.netlify\.com\/[a-z0-9_/?=&.-]+/i) || [])[0];

          if (!url) {
            console.error('Netlify did not return a recognizable live URL.');
            process.exit(1);
          }

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `url=${url}\n`);
          if (claim) fs.appendFileSync(process.env.GITHUB_OUTPUT, `claim_url=${claim}\n`);

          const summary = [
            '# Tierney’s Tavern Netlify preview',
            '',
            `**Live preview:** ${url}`,
            '',
            claim ? `**Claim this temporary project:** ${claim}` : '**Claim URL:** see the Netlify CLI output above.',
            '',
            '> The project is configured as a noindex design dossier, not the official tavern website.',
          ].join('\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${summary}\n`);
          console.log(`LIVE_PREVIEW=${url}`);
          if (claim) console.log(`CLAIM_URL=${claim}`);
          NODE

      - name: Preserve deploy bundle and response
        uses: actions/upload-artifact@v4
        with:
          name: tierneys-netlify-preview
          path: |
            dist
            netlify-deploy.json
          if-no-files-found: error
          retention-days: 7

      - name: Print deployment destination
        run: |
          echo "Live preview: ${{ steps.netlify.outputs.url }}"
          if [[ -n "${{ steps.netlify.outputs.claim_url }}" ]]; then
            echo "Claim URL: ${{ steps.netlify.outputs.claim_url }}"
          fi

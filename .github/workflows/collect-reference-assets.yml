name: Collect sourced reference assets

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ASSET_SOURCES.json
      - scripts/fetch_reference_assets.py
      - .github/workflows/collect-reference-assets.yml

permissions:
  contents: write

concurrency:
  group: collect-tierneys-reference-assets
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download and validate every declared image
        run: python scripts/fetch_reference_assets.py

      - name: Generate exact-location QR code
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qrencode
          mkdir -p assets/location
          qrencode \
            --type=SVG \
            --level=Q \
            --margin=2 \
            --output=assets/location/tierneys-directions-qr.svg \
            'https://www.google.com/maps/search/?api=1&query=Tierney%27s%20Tavern%2C%20138%20Valley%20Road%2C%20Montclair%2C%20NJ%2007042'

      - name: Commit collected assets
        shell: bash
        run: |
          git add assets/reference assets/brand assets/location
          if git diff --cached --quiet; then
            echo "Reference assets already match their sources."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "assets: collect attributed Tierney's references [skip ci]"
          git push

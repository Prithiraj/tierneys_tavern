name: Deploy Tierney's concept to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - index.html
      - scripts/build_site.sh
      - scripts/generate_public_assets.py
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build passwordless outreach site
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build public-only bundle
        id: site
        shell: bash
        run: |
          SITE_URL="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}"
          echo "url=$SITE_URL" >> "$GITHUB_OUTPUT"
          COMMIT_SHA="$GITHUB_SHA" PUBLIC_SITE_URL="$SITE_URL" bash scripts/build_site.sh

      - name: Verify outreach and Pages constraints
        env:
          SITE_URL: ${{ steps.site.outputs.url }}
        shell: bash
        run: |
          test -s dist/index.html
          test -s dist/404.html
          test -e dist/.nojekyll
          test -s dist/assets/public/tierneys-social-card.png
          ! grep -R -i -E "research before render|real asset board|assets/reference|ASSET_MANIFEST|WEBSITE_DESIGN_PLAN|netlify" dist
          grep -F "$SITE_URL/assets/public/tierneys-social-card.png" dist/index.html
          grep -F "<link rel=\"canonical\" href=\"$SITE_URL/\">" dist/index.html
          test "$(find dist -type f | wc -l)" -le 8

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist
          include-hidden-files: true

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
